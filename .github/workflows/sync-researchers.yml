name: Sync Researchers Weekly

on:
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

env:
  CI: true

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync Researchers from Google Sheets
    # As credenciais do Google estão cadastradas como secrets do ambiente
    # "Production", então o job precisa declarar o ambiente pra enxergá-las.
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync researchers
        run: npm run sync:researchers
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}

      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet src/content/researchers/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/content/researchers/
          git commit -m "🔄 chore: sync researchers from Google Sheets"
          git push

      - name: Log sync result
        if: always()
        run: |
          if [ -f "src/content/researchers.sync.log" ]; then
            echo "=== Sync Summary ===" 
            tail -n 20 src/content/researchers.sync.log
          fi
